<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamid Gurmani | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="container">
            <a href="#" class="logo">HG</a>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="https://github.com/hamidgurmani" target="_blank" rel="noopener noreferrer">GitHub</a></li>
                <li><a href="https://www.linkedin.com/in/hamid-jalil-devops/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
            </ul>
        </div>
    </nav>

    <header id="about">
        <div class="container">
            <h1 class="reveal">Hamid Gurmani</h1>
            <p class="subtitle reveal">Software Engineer & Creative Developer</p>
            <p class="bio reveal">Building scalable solutions and exploring the intersection of technology and design.</p>
        </div>
    </header>

    <main class="container" id="projects">
        <h2 class="section-title reveal">Featured Projects</h2>
        <div id="projects-grid" class="projects-grid">
            <!-- Projects will be injected here by script.js -->
        </div>
    </main>

    <section id="contact" class="container">
        <h2 class="section-title reveal">Get In Touch</h2>
        <div class="contact-container">
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="How can I help you?"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="submit-btn">Send Message</button>
                <div id="form-status" class="form-status"></div>
            </form>
        </div>
    </section>

    <footer id="footer">
        <div class="container">
            <p>&copy; 2026 Hamid Gurmani. Built with Docker & Nginx.</p>
        </div>
    </footer>

    <button id="back-to-top" title="Go to top" aria-label="Back to top">↑</button>

    <script src="script.js"></script>
</body>
</html>
